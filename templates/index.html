<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evil Gemma-4 E4B</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Evil Gemma-4 E4B</h1>
        </header>

        <main id="chat-window" class="chat-window">
            <div class="message system">
                <p>Welcome! Type a message to start chatting with Evil Gemma-4 E4B.</p>
            </div>
            <!-- Messages will be appended here -->
        </main>

        <footer class="input-area">
            <input id="image-input" type="file" accept="image/*" hidden>
            <button id="upload-btn" class="icon-btn" title="Upload Image" type="button">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <div id="image-preview" class="image-preview hidden" aria-live="polite">
                <img id="preview-image" alt="Selected upload preview">
                <button id="clear-image-btn" class="clear-image-btn" type="button" title="Remove Image">Remove</button>
            </div>
            <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" class="icon-btn" title="Send Message">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
